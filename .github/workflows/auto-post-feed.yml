name: Publication automatique du fil d'actualité

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: pip install requests
      - name: Publier dans le fil
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: python3 scripts/post_to_feed.py
