name: Publication automatique du fil d'actualité

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: pip install requests google-auth
      - name: Publier dans le fil
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 scripts/post_to_feed.py
