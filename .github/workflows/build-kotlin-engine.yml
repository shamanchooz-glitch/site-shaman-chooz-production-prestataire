name: Build du moteur Kotlin du chatbot

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'shaman-lexicon.json'
      - '.github/workflows/build-kotlin-engine.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Tests des 8 moteurs thématiques (55 scénarios, version JavaScript de référence)
        run: node test-moteurs.cjs

      - name: Compiler le moteur Kotlin vers JavaScript
        run: |
          set -o pipefail
          gradle jsBrowserProductionWebpack --no-daemon 2>&1 | tee build.log

      - name: Afficher les erreurs de compilation (uniquement si la compilation a échoué)
        if: failure()
        run: |
          {
            echo "### Erreurs de compilation Kotlin"
            echo '```'
            if [ -f build.log ]; then
              grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -40
              echo "--- Résumé Gradle ---"
              grep -A6 "What went wrong" build.log | head -12
            else
              echo "Pas de journal de compilation : l'erreur est dans une étape précédente."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Récupérer le fichier compilé
        run: |
          F=$(find build -path '*roductionExecutable*' -name 'shaman-engine*.js' ! -name '*.map' | head -n 1)
          echo "Fichier trouvé : $F"
          test -n "$F"
          cp "$F" shaman-engine-kotlin.js

      - name: Test de fumée (le moteur compilé répond-il correctement ?)
        run: node smoke-test.cjs shaman-engine-kotlin.js

      - name: Tests chatbot des 8 moteurs sur le moteur Kotlin compilé
        # Non bloquant au premier build : à passer en bloquant (supprimer la ligne suivante) quand tout est vert.
        continue-on-error: true
        run: node test-chatbot-moteurs.cjs shaman-engine-kotlin.js

      - name: Publier shaman-engine-kotlin.js dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shaman-engine-kotlin.js
          git diff --cached --quiet || (git commit -m "Build du moteur Kotlin du chatbot" && git push)
